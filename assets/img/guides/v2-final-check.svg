    <rect x="50" y="330" width="900" height="44" rx="14" fill="#ecfeff"/>
    <text x="82" y="358" font-family="Arial,sans-serif" font-size="18" fill="#0f766e">접수 후 파일 변경이 필요한 경우 제작 일정과 금액이 달라질 수 있습니다.</text>
