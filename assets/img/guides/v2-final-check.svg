  <text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#64748b">최종본 확인 후 접수하면 재작업과 제작 지연을 줄일 수 있습니다.</text>
  <g transform="translate(95 145)" filter="url(#s)">
    <rect width="1010" height="395" rx="30" fill="#fff"/>
    <g font-family="Arial,sans-serif" font-size="22" fill="#334155">
      <rect x="50" y="55" width="410" height="64" rx="18" fill="#ecfdf5"/><circle cx="85" cy="87" r="16" fill="url(#g)"/><path d="M76 86l7 7 15-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="95">최종 파일인지 확인</text>
      <rect x="50" y="145" width="410" height="64" rx="18" fill="#f8fafc"/><circle cx="85" cy="177" r="16" fill="url(#g)"/><path d="M76 176l7 7 15-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="185">오탈자·페이지 순서 확인</text>
      <rect x="50" y="235" width="410" height="64" rx="18" fill="#f8fafc"/><circle cx="85" cy="267" r="16" fill="url(#g)"/><path d="M76 266l7 7 15-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="275">사이즈·수량·제본 방향 확인</text>
      <rect x="540" y="55" width="410" height="64" rx="18" fill="#f8fafc"/><circle cx="575" cy="87" r="16" fill="url(#g)"/><path d="M566 86l7 7 15-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="95">도련·안전여백 확인</text>
      <rect x="540" y="145" width="410" height="64" rx="18" fill="#f8fafc"/><circle cx="575" cy="177" r="16" fill="url(#g)"/><path d="M566 176l7 7 15-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="185">연락처·납기·요청사항 입력</text>
