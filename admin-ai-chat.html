<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 상담 설정 | 그린오피스</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-slate-900 text-white border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <div>
        <h1 class="text-lg font-black tracking-tight"><i class="fas fa-robot mr-2 text-emerald-400"></i>AI 상담 설정</h1>
        <p class="text-xs text-slate-400 mt-1">Gemini 상담 답변 기준을 관리합니다.</p>
      </div>
      <div class="flex gap-2">
        <a href="admin.html" class="px-3 py-2 rounded-lg bg-white/10 hover:bg-white/15 text-sm font-bold">관리자</a>
        <a href="index.html" class="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-sm font-bold">홈으로</a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <div id="status" class="mb-4 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-500">관리자 권한 확인 중...</div>

    <form id="aiForm" class="hidden space-y-5">
      <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between gap-3">
          <div>
            <h2 class="font-black text-slate-800">기본 설정</h2>
            <p class="text-xs text-slate-500 mt-1">처음에는 무료우선 모드와 낮은 사용량 제한을 권장합니다.</p>
          </div>
          <label class="inline-flex items-center gap-2 text-sm font-bold">
            <input id="enabled" type="checkbox" class="w-4 h-4 accent-emerald-600" /> AI 상담 사용
          </label>
        </div>
        <div class="p-5 grid md:grid-cols-3 gap-4">
          <label class="block">
            <span class="text-xs font-bold text-slate-500">기본 모델</span>
            <select id="defaultMode" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
              <option value="lite">2.0 호환 / 무료우선</option>
              <option value="flash">2.5 Flash / 품질우선</option>
            </select>
          </label>
          <label class="block">
            <span class="text-xs font-bold text-slate-500">전체 하루 제한</span>
            <input id="dailyGlobalLimit" type="number" min="1" max="5000" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
          </label>
          <label class="block">
            <span class="text-xs font-bold text-slate-500">방문자별 하루 제한</span>
            <input id="dailyClientLimit" type="number" min="1" max="100" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
          </label>
        </div>
      </section>

      <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 bg-slate-50">
          <h2 class="font-black text-slate-800">AI 역할 지침</h2>
          <p class="text-xs text-slate-500 mt-1">AI가 어떤 상담원처럼 말해야 하는지 적습니다.</p>
        </div>
        <div class="p-5">
          <textarea id="systemPrompt" rows="6" class="w-full rounded-xl border border-slate-300 px-3 py-3 text-sm leading-6" placeholder="예: 너는 그린오피스의 출력·제본 전문 상담원이다. 답변은 짧고 친절하게 한다."></textarea>
        </div>
      </section>

      <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 bg-slate-50">
          <h2 class="font-black text-slate-800">상담 기준 / 금지 답변</h2>
          <p class="text-xs text-slate-500 mt-1">확정하면 안 되는 내용, 반드시 안내해야 하는 문구를 적습니다.</p>
        </div>
        <div class="p-5">
          <textarea id="answerRules" rows="8" class="w-full rounded-xl border border-slate-300 px-3 py-3 text-sm leading-6" placeholder="예: 최종 견적금액, 납기, 제작 가능 여부는 관리자 확인 후 확정된다. 파일 확인 전에는 제작 가능하다고 단정하지 않는다."></textarea>
        </div>
      </section>

      <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 bg-slate-50">
          <h2 class="font-black text-slate-800">업체 안내 / 자주 쓰는 답변</h2>
          <p class="text-xs text-slate-500 mt-1">영업시간, 접수 기준, 파일 기준, 제본 안내, 견적 안내 등을 자유롭게 적습니다.</p>
        </div>
        <div class="p-5">
          <textarea id="shopGuide" rows="12" class="w-full rounded-xl border border-slate-300 px-3 py-3 text-sm leading-6" placeholder="예: 무선제본은 PDF 파일 확인 후 진행한다. 표지는 250g 이상 권장. 도련은 사방 3mm 필요. 급한 작업은 전화 확인 필요."></textarea>
        </div>
      </section>

      <div class="sticky bottom-0 bg-slate-100/90 backdrop-blur border-t border-slate-200 py-4 flex flex-col sm:flex-row gap-3 justify-end">
        <button id="resetBtn" type="button" class="px-5 py-3 rounded-xl border border-slate-300 bg-white text-slate-700 font-black hover:bg-slate-50">기본 예시 입력</button>
        <button id="saveBtn" type="submit" class="px-6 py-3 rounded-xl bg-emerald-600 text-white font-black hover:bg-emerald-700"><i class="fas fa-save mr-2"></i>저장</button>
      </div>
    </form>
  </main>

  <script type="module">
    import { auth, db, onAuthStateChanged, doc, getDoc, setDoc, serverTimestamp } from './assets/js/firebase.js';

    const $ = (id) => document.getElementById(id);
    const status = $('status');
    const form = $('aiForm');
    const ref = doc(db, 'settings', 'aiChat');

    const defaults = {
      enabled: true,
      defaultMode: 'lite',
      dailyGlobalLimit: 50,
      dailyClientLimit: 5,
      systemPrompt: '너는 그린오피스의 출력, 제본, 책자 제작, 디지털 인쇄 상담원이다. 답변은 한국어로 짧고 명확하게 한다. 고객이 바로 다음 행동을 알 수 있도록 안내한다.',
      answerRules: '최종 견적금액, 제작 가능 여부, 납기, 환불 여부는 관리자 확인 후 확정된다고 안내한다. 파일 확인 전에는 제작 가능하다고 단정하지 않는다. 고객 개인정보나 다른 고객 정보는 답변하지 않는다. 견적이 필요한 경우 책자/제본은 quote-book.html, 낱장/디지털 인쇄는 quote-print.html로 안내한다.',
      shopGuide: '파일은 PDF 권장. 글꼴은 포함하거나 아웃라인 처리. 이미지 해상도는 300dpi 권장. 재단 작업은 사방 3mm 도련과 5mm 안전여백 권장. 무선제본, 중철제본, 와이어제본은 페이지 수와 용도에 따라 안내한다. 급한 작업, 대량 작업, 특수 후가공은 전화 또는 관리자 확인이 필요하다.'
    };

    function fill(data) {
      const d = { ...defaults, ...(data || {}) };
      $('enabled').checked = d.enabled !== false;
      $('defaultMode').value = d.defaultMode || 'lite';
      $('dailyGlobalLimit').value = d.dailyGlobalLimit || 50;
      $('dailyClientLimit').value = d.dailyClientLimit || 5;
      $('systemPrompt').value = d.systemPrompt || '';
      $('answerRules').value = d.answerRules || '';
      $('shopGuide').value = d.shopGuide || '';
    }

    async function requireAdmin(user) {
      if (!user || user.isAnonymous) return false;
      const snap = await getDoc(doc(db, 'users', user.uid));
      return snap.exists() && snap.data()?.role === 'admin';
    }

    onAuthStateChanged(auth, async (user) => {
      try {
        const ok = await requireAdmin(user);
        if (!ok) {
          status.className = 'mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700';
          status.textContent = '관리자 로그인이 필요합니다. admin.html에서 로그인 후 다시 접속하세요.';
          return;
        }
        const snap = await getDoc(ref);
        fill(snap.exists() ? snap.data() : defaults);
        status.className = 'mb-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700';
        status.textContent = '관리자 확인 완료. AI 상담 기준을 수정할 수 있습니다.';
        form.classList.remove('hidden');
      } catch (e) {
        status.className = 'mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700';
        status.textContent = '설정 로딩 실패: ' + (e.message || e);
      }
    });

    $('resetBtn').addEventListener('click', () => fill(defaults));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      $('saveBtn').disabled = true;
      status.className = 'mb-4 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-500';
      status.textContent = '저장 중...';
      try {
        await setDoc(ref, {
          enabled: $('enabled').checked,
          defaultMode: $('defaultMode').value,
          dailyGlobalLimit: Number($('dailyGlobalLimit').value || 50),
          dailyClientLimit: Number($('dailyClientLimit').value || 5),
          systemPrompt: $('systemPrompt').value.trim(),
          answerRules: $('answerRules').value.trim(),
          shopGuide: $('shopGuide').value.trim(),
          updatedAt: serverTimestamp(),
        }, { merge: true });
        status.className = 'mb-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700';
        status.textContent = '저장 완료. 이후 AI 상담 답변에 바로 반영됩니다.';
      } catch (err) {
        status.className = 'mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700';
        status.textContent = '저장 실패: ' + (err.message || err);
      } finally {
        $('saveBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
