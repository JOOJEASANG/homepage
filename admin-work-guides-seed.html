<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작업가이드 기본 데이터 생성 | 그린오피스</title>
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
  <style>body{font-family:Pretendard,sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="min-h-screen flex items-center justify-center p-4">
    <section class="w-full max-w-2xl bg-white border border-slate-200 rounded-2xl shadow-xl p-8">
      <p class="text-xs font-black tracking-[0.2em] text-emerald-600 uppercase mb-2">Admin Seed</p>
      <h1 class="text-2xl font-black mb-3">작업가이드 기본 데이터 생성</h1>
      <p class="text-sm text-slate-500 leading-7 mb-6">관리자 로그인 상태에서만 실행됩니다. 버튼을 누르면 출력·제본·디지털인쇄용 기본 가이드가 <b>work_guides</b> 컬렉션에 추가됩니다. 이미 같은 제목이 있으면 중복 등록하지 않습니다.</p>
      <div id="seed-status" class="rounded-xl bg-slate-50 border border-slate-200 p-4 text-sm text-slate-500 mb-5">로그인 상태를 확인하는 중입니다.</div>
      <div class="flex flex-col sm:flex-row gap-3">
        <button id="seed-btn" disabled class="flex-1 px-5 py-3 rounded-xl bg-emerald-600 text-white font-black disabled:opacity-40 disabled:cursor-not-allowed">기본 작업가이드 생성</button>
        <a href="admin.html" class="px-5 py-3 rounded-xl border border-slate-300 text-slate-600 font-bold text-center">관리자페이지로 이동</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { auth, db, onAuthStateChanged, collection, addDoc, getDocs, doc, getDoc, serverTimestamp } from './assets/js/firebase.js';

    const statusEl = document.getElementById('seed-status');
    const seedBtn = document.getElementById('seed-btn');
    let adminUser = null;

    const guides = [
      ['01. 파일 접수 기본 안내', '<h2>파일 접수 전 확인</h2><p>인쇄용 파일은 PDF 접수를 권장합니다. 파일명에는 작업명, 수량, 사이즈를 구분해서 적어주시면 확인이 빠릅니다.</p><ul><li>PDF 권장</li><li>페이지 순서 확인</li><li>오탈자 확인</li><li>재단 사이즈 확인</li><li>연락처 확인</li></ul>'],
      ['02. PDF 저장 및 글꼴 깨짐 방지', '<h2>PDF 저장 안내</h2><p>문서 프로그램에서 PDF로 저장할 때 글꼴 포함 옵션을 사용해 주세요. 일러스트 파일은 글자를 아웃라인 처리하면 글꼴 깨짐을 줄일 수 있습니다.</p><ul><li>PDF 저장 권장</li><li>글꼴 포함 또는 아웃라인 처리</li><li>이미지 누락 여부 확인</li></ul>'],
      ['03. 이미지 해상도 안내', '<h2>해상도 기준</h2><p>선명한 출력물을 위해 이미지는 300dpi 기준을 권장합니다. 화면 캡처 이미지는 확대 출력 시 흐리게 보일 수 있습니다.</p><ul><li>사진·이미지 300dpi 권장</li><li>카카오톡·문자 전달 이미지 주의</li><li>작은 이미지를 억지로 키우면 품질이 떨어질 수 있음</li></ul>'],
      ['04. 여백·도련·재단선 안내', '<h2>재단 여백 안내</h2><p>재단 과정에서 1~2mm 정도 오차가 생길 수 있습니다. 배경이 끝까지 들어가는 디자인은 사방 3mm 도련을 추가하는 것이 좋습니다.</p><ul><li>중요 글자는 재단선 안쪽으로 배치</li><li>배경은 도련까지 확장</li><li>테두리 디자인은 재단 오차가 눈에 띌 수 있음</li></ul>'],
      ['05. 책자·제본 기본 안내', '<h2>책자 제작 기본</h2><p>책자 제작 시 표지, 내지, 페이지 수, 제본 방향을 확인해야 합니다. 페이지 수는 표지 포함 여부에 따라 견적이 달라질 수 있습니다.</p><ul><li>표지 별도 여부 확인</li><li>내지 페이지 수 확인</li><li>좌철·상철 방향 확인</li><li>단면·양면 인쇄 확인</li></ul>'],
      ['06. 무선제본 작업 안내', '<h2>무선제본 안내</h2><p>무선제본은 책등이 생기는 제본 방식입니다. 페이지 수와 종이 두께에 따라 책등 폭이 달라집니다.</p><ul><li>표지는 앞표지·책등·뒷표지를 한 장으로 제작</li><li>책등 폭은 최종 페이지 수 확인 후 결정</li><li>본문 안쪽 여백을 충분히 확보</li></ul>'],
      ['07. 중철제본 작업 안내', '<h2>중철제본 안내</h2><p>중철제본은 가운데를 접어 스테이플러로 고정하는 방식입니다. 전체 페이지 수는 4페이지 단위가 가장 안정적입니다.</p><ul><li>4페이지 단위 권장</li><li>페이지 순서는 작업자가 제본 순서에 맞게 확인</li><li>두꺼운 책자는 중철이 어려울 수 있음</li></ul>'],
      ['08. 와이어·스프링 제본 안내', '<h2>와이어·스프링 제본 안내</h2><p>타공이 들어가는 제본은 구멍 위치 때문에 안쪽 여백이 필요합니다. 좌철, 상철 방향을 접수 시 선택해 주세요.</p><ul><li>타공 여백 확보</li><li>좌철·상철 확인</li><li>표지 재질과 투명표지 여부 확인</li></ul>'],
      ['09. 디지털 인쇄 기본 안내', '<h2>디지털 인쇄 안내</h2><p>소량 인쇄, 빠른 출력, 다양한 용지 선택에 적합합니다. 흑백/컬러, 단면/양면, 용지 종류에 따라 금액이 달라집니다.</p><ul><li>흑백 또는 컬러 선택</li><li>단면 또는 양면 선택</li><li>용지 평량과 종류 확인</li><li>수량 확인</li></ul>'],
      ['10. 리플렛·전단·포스터 안내', '<h2>홍보물 제작 안내</h2><p>리플렛, 전단, 포스터는 재단 사이즈와 접지 여부가 중요합니다. 접지가 있는 경우 접히는 위치에 중요한 글자가 걸리지 않게 배치해 주세요.</p><ul><li>완성 사이즈 확인</li><li>접지 방식 확인</li><li>코팅 여부 확인</li><li>재단 여백 확인</li></ul>'],
      ['11. 후가공 안내', '<h2>후가공 종류</h2><p>코팅, 오시, 접지, 타공, 라미네이팅 등 후가공은 제작 기간과 금액에 영향을 줄 수 있습니다.</p><ul><li>코팅: 표면 보호 및 질감 개선</li><li>오시: 접히는 선 작업</li><li>접지: 리플렛 접는 작업</li><li>타공: 바인더 또는 제본용 구멍</li></ul>'],
      ['12. 접수 전 최종 체크리스트', '<h2>최종 체크리스트</h2><ul><li>파일이 최종본인지 확인</li><li>오탈자 확인</li><li>페이지 순서 확인</li><li>사이즈와 수량 확인</li><li>제본 방향 확인</li><li>연락처 확인</li><li>희망 납기 확인</li></ul>']
    ];

    function setStatus(msg, tone='info') {
      const cls = tone === 'error' ? 'bg-red-50 border-red-200 text-red-700' : tone === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-slate-50 border-slate-200 text-slate-500';
      statusEl.className = 'rounded-xl border p-4 text-sm mb-5 ' + cls;
      statusEl.textContent = msg;
    }

    async function checkAdmin(user) {
      if (!user || user.isAnonymous) return false;
      const snap = await getDoc(doc(db, 'users', user.uid));
      return snap.exists() && snap.data().role === 'admin';
    }

    onAuthStateChanged(auth, async (user) => {
      try {
        const ok = await checkAdmin(user);
        if (!ok) {
          adminUser = null;
          seedBtn.disabled = true;
          setStatus('관리자 로그인이 필요합니다. 먼저 관리자페이지에서 로그인한 뒤 다시 열어주세요.', 'error');
          return;
        }
        adminUser = user;
        seedBtn.disabled = false;
        setStatus('관리자 확인 완료. 기본 작업가이드 데이터를 생성할 수 있습니다.');
      } catch (e) {
        seedBtn.disabled = true;
        setStatus('관리자 권한 확인 중 오류가 발생했습니다.', 'error');
      }
    });

    seedBtn.addEventListener('click', async () => {
      if (!adminUser) return;
      if (!confirm('출력/제본/디지털인쇄 기본 작업가이드를 생성할까요?')) return;
      seedBtn.disabled = true;
      setStatus('기존 가이드 확인 중입니다.');
      try {
        const snap = await getDocs(collection(db, 'work_guides'));
        const existingTitles = new Set(snap.docs.map(d => String(d.data().title || '').trim()));
        let added = 0;
        let orderBase = snap.size;
        for (const [title, contentHtml] of guides) {
          if (existingTitles.has(title)) continue;
          const content = contentHtml.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          await addDoc(collection(db, 'work_guides'), {
            title,
            content,
            contentHtml,
            order: ++orderBase,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
          });
          added++;
        }
        setStatus(`완료: ${added}개 가이드가 추가되었습니다. 기존 제목은 중복 등록하지 않았습니다.`, 'success');
      } catch (e) {
        console.error(e);
        setStatus('가이드 생성 실패: 권한 또는 네트워크를 확인하세요.', 'error');
      } finally {
        seedBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
