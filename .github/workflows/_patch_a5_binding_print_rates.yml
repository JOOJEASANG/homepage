name: Patch A5 binding print rates
on:
  push:
    branches: [fix/a5-perfect-wire-print-rate]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch A5 print rates by binding type
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('assets/js/pages/quote-book.js')
          s = p.read_text(encoding='utf-8')

          pattern1 = r"const isA5Saddle = primarySizeSelect\?\.value === 'a5' && selectedBindingType === 'saddle';[\s\S]*?const printSizeMultiplier = isA5Saddle \? 0\.60 : itemSizeMultiplier;"
          repl1 = """const isA5 = primarySizeSelect?.value === 'a5';
            const isA5Saddle = isA5 && selectedBindingType === 'saddle';
            const isA5PerfectOrWire = isA5 && (selectedBindingType === 'perfect' || selectedBindingType === 'wire');
            // A5 인쇄비만 제본 방식에 따라 별도 배율 적용:
            // 중철 60%, 무선/와이어 70%. 제본/간지/오시 등 작업비는 기존 A5 배율을 유지합니다.
            const printSizeMultiplier = isA5Saddle ? 0.60 : (isA5PerfectOrWire ? 0.70 : itemSizeMultiplier);"""
          s, n1 = re.subn(pattern1, repl1, s, count=1)
          if n1 != 1: raise SystemExit('marker 1 not found')

          pattern2 = r"const sizeMultiplier = \(selectedBindingType === 'saddle' && sectionSizeValue === 'a5'\)\s*\? 0\.60\s*:\s*normalSizeMultiplier;"
          repl2 = """const sizeMultiplier = sectionSizeValue === 'a5'
                    ? (selectedBindingType === 'saddle' ? 0.60 : ((selectedBindingType === 'perfect' || selectedBindingType === 'wire') ? 0.70 : normalSizeMultiplier))
                    : normalSizeMultiplier;"""
          s, n2 = re.subn(pattern2, repl2, s, count=1)
          if n2 != 1: raise SystemExit('marker 2 not found')

          p.write_text(s, encoding='utf-8')
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/quote-book.js
          git commit -m "fix: apply 70 percent print rate for A5 perfect and wire [patched]"
          git push