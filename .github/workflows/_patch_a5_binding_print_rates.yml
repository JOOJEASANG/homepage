name: Patch A5 binding print rates
on:
  push:
    branches: [fix/a5-perfect-wire-print-rate]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch A5 print rates by binding type
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/js/pages/quote-book.js')
          s = p.read_text(encoding='utf-8')

          old = """            const isA5Saddle = primarySizeSelect?.value === 'a5' && selectedBindingType === 'saddle';
            // A5 중철은 2-up 출력 효율을 반영해 인쇄 관련 비용만 A4의 60%로 계산합니다.
            // 제본/간지/오시 등 작업비는 기존 A5 배율(관리자 설정, 기본 85%)을 유지합니다.
            const printSizeMultiplier = isA5Saddle ? 0.60 : itemSizeMultiplier;"""
          new = """            const isA5 = primarySizeSelect?.value === 'a5';
            const isA5Saddle = isA5 && selectedBindingType === 'saddle';
            const isA5PerfectOrWire = isA5 && (selectedBindingType === 'perfect' || selectedBindingType === 'wire');
            // A5 인쇄비만 제본 방식에 따라 별도 배율 적용:
            // 중철 60%, 무선/와이어 70%. 제본/간지/오시 등 작업비는 기존 A5 배율을 유지합니다.
            const printSizeMultiplier = isA5Saddle ? 0.60 : (isA5PerfectOrWire ? 0.70 : itemSizeMultiplier);"""
          if old not in s: raise SystemExit('marker 1 not found')
          s = s.replace(old, new, 1)

          old = """                const sizeMultiplier = (selectedBindingType === 'saddle' && sectionSizeValue === 'a5')
                    ? 0.60
                    : normalSizeMultiplier;"""
          new = """                const sizeMultiplier = sectionSizeValue === 'a5'
                    ? (selectedBindingType === 'saddle' ? 0.60 : ((selectedBindingType === 'perfect' || selectedBindingType === 'wire') ? 0.70 : normalSizeMultiplier))
                    : normalSizeMultiplier;"""
          if old not in s: raise SystemExit('marker 2 not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/quote-book.js
          git commit -m "fix: apply 70 percent print rate for A5 perfect and wire [patched]"
          git push