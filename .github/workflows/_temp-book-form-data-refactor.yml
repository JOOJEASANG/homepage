name: TEMP Book Form Data Refactor

on:
  push:
    branches:
      - refactor/book-form-data-storage

permissions:
  contents: write

jobs:
  apply_refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/book-form-data-storage
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply guarded form refactor
        run: python3 scripts/apply-book-form-data-refactor.py

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run book tests
        run: npm run test:book

      - name: Syntax check quote book
        run: cp assets/js/pages/quote-book.js /tmp/quote-book.mjs && node --check /tmp/quote-book.mjs

      - name: Commit generated integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/quote-book.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "refactor: connect shared book form serializers"
          git push origin HEAD:refactor/book-form-data-storage
