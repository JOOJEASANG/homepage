name: Deploy preview to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate_functions:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Functions Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Audit Functions dependencies
        working-directory: functions
        run: npm audit

      - name: Syntax check Functions entrypoint
        working-directory: functions
        run: node --check index.js

      - name: Load Functions module
        working-directory: functions
        run: node -e "const m=require('./index.js'); if(!m.aiChat||!m.aiChatConfig) process.exit(1); console.log('functions module load passed')"

  build_and_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: validate_functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Test book calculators
        run: npm run test:book

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Syntax check book entrypoint
        run: node --check assets/js/pages/quote-book.js

      - name: Smoke test book quote files locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/quote-book-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          BASE_URL="http://127.0.0.1:4173"

          for _ in {1..10}; do
            if curl -fsSL "$BASE_URL/quote-book.html" -o /tmp/quote-book.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/quote-book.html
          grep -F 'assets/js/pages/quote-book.js' /tmp/quote-book.html

          curl -fsSL "$BASE_URL/assets/js/pages/quote-book.js" -o /tmp/quote-book.js
          grep -F 'getSaddleSectionMetrics' /tmp/quote-book.js
          grep -F 'getPerfectInnerPricingMultiplier' /tmp/quote-book.js
          grep -F 'getWireInnerPricingMultiplier' /tmp/quote-book.js
          grep -F 'getWireBindingMetrics' /tmp/quote-book.js
          grep -F 'findBindingPriceTier' /tmp/quote-book.js
          grep -F 'floorToHundred' /tmp/quote-book.js
          grep -F 'quote-item-template.js' /tmp/quote-book.js
          grep -F 'quote-storage.js' /tmp/quote-book.js
          grep -F 'quote-form-data.js' /tmp/quote-book.js
          grep -F 'quote-request-data.js' /tmp/quote-book.js
          grep -F 'buildQuoteRequestData' /tmp/quote-book.js
          grep -F 'buildQuoteUpdatePayload' /tmp/quote-book.js
          grep -F 'contact-utils.js' /tmp/quote-book.js
          grep -F 'preview-ui.js' /tmp/quote-book.js
          grep -F 'page-state.js' /tmp/quote-book.js
          grep -F 'guest-session.js' /tmp/quote-book.js
          grep -F 'submit-lock.js' /tmp/quote-book.js

          curl -fsSL "$BASE_URL/assets/js/pages/quote-book/calculator-utils.js" -o /tmp/calculator-utils.js
          grep -F 'export function positiveNumber' /tmp/calculator-utils.js
          grep -F 'export function findPriceTier' /tmp/calculator-utils.js
          grep -F 'export function findBindingPriceTier' /tmp/calculator-utils.js
          grep -F 'export function getBindingPageCount' /tmp/calculator-utils.js
          grep -F 'export function floorToHundred' /tmp/calculator-utils.js
          grep -F 'export function getLargeSizeMultiplier' /tmp/calculator-utils.js

          curl -fsSL "$BASE_URL/assets/js/pages/quote-book/saddle-calculator.js" -o /tmp/saddle-calculator.js
          grep -F 'export function getSaddleSheetsPerCopy' /tmp/saddle-calculator.js

          curl -fsSL "$BASE_URL/assets/js/pages/quote-book/perfect-calculator.js" -o /tmp/perfect-calculator.js
          grep -F "from './calculator-utils.js'" /tmp/perfect-calculator.js
          grep -F 'export function getPerfectBindingMetrics' /tmp/perfect-calculator.js

          curl -fsSL "$BASE_URL/assets/js/pages/quote-book/wire-calculator.js" -o /tmp/wire-calculator.js
          grep -F "from './calculator-utils.js'" /tmp/wire-calculator.js
          grep -F 'export function getWireCoverCost' /tmp/wire-calculator.js
          grep -F 'export function getWireBindingMetrics' /tmp/wire-calculator.js

          for file in contact-utils.js preview-utils.js preview-ui.js quote-storage.js quote-item-template.js quote-id.js quote-form-data.js quote-request-data.js page-state.js guest-session.js submit-lock.js; do
            curl -fsSL "$BASE_URL/assets/js/pages/quote-book/$file" -o "/tmp/$file"
            test -s "/tmp/$file"
          done
          grep -F 'export function sha256HexSync' /tmp/contact-utils.js
          grep -F 'export function getPreviewUrl' /tmp/preview-utils.js
          grep -F 'export function openPreviewLayer' /tmp/preview-ui.js
          grep -F 'export function readLastQuoteCache' /tmp/quote-storage.js
          grep -F 'export function writeBookDraft' /tmp/quote-storage.js
          grep -F 'export function serializeQuoteItems' /tmp/quote-form-data.js
          grep -F 'export function buildQuoteRequestData' /tmp/quote-request-data.js
          grep -F 'export function buildQuoteUpdatePayload' /tmp/quote-request-data.js
          grep -F 'export function isAdminEditSearch' /tmp/page-state.js
          grep -F 'export function parseQuoteReloadPayload' /tmp/page-state.js
          grep -F 'export function readGuestSubmitSession' /tmp/guest-session.js
          grep -F 'export function restoreGuestSessionFromReload' /tmp/guest-session.js
          grep -F 'export function acquireBookSubmitLock' /tmp/submit-lock.js
          grep -F 'export function renderQuoteItemTemplate' /tmp/quote-item-template.js
          grep -F 'export async function generateBookReceiptNo' /tmp/quote-id.js

      - name: Deploy preview to Firebase Hosting
        id: firebase_preview
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: worklist-1e83a
