name: Deploy preview to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  build_and_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Apply saddle calculator refactor once
        id: saddle_patch
        shell: bash
        run: |
          python scripts/apply-saddle-refactor.py
          if git diff --quiet -- assets/js/pages/quote-book.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/js/pages/quote-book.js
            git commit -m "refactor: connect saddle calculator to book quote"
            git push origin HEAD:${{ github.head_ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test saddle calculator
        if: steps.saddle_patch.outputs.changed != 'true'
        run: npm run test:saddle

      - name: Build Tailwind CSS
        if: steps.saddle_patch.outputs.changed != 'true'
        run: npm run build:css

      - name: Deploy preview to Firebase Hosting
        if: steps.saddle_patch.outputs.changed != 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: worklist-1e83a
