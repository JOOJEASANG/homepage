name: Deploy preview to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  build_and_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Apply perfect calculator refactor once
        id: perfect_patch
        shell: bash
        run: |
          python scripts/apply-perfect-refactor.py
          if git diff --quiet -- assets/js/pages/quote-book.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/js/pages/quote-book.js
            git commit -m "refactor: connect perfect calculator to book quote"
            git push origin HEAD:${{ github.head_ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test book calculators
        if: steps.perfect_patch.outputs.changed != 'true'
        run: npm run test:book

      - name: Build Tailwind CSS
        if: steps.perfect_patch.outputs.changed != 'true'
        run: npm run build:css

      - name: Deploy preview to Firebase Hosting
        if: steps.perfect_patch.outputs.changed != 'true'
        id: firebase_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: worklist-1e83a

      - name: Smoke test deployed book quote preview
        if: steps.perfect_patch.outputs.changed != 'true'
        env:
          PREVIEW_URL: ${{ steps.firebase_preview.outputs.details_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          BASE_URL="${PREVIEW_URL%/}"

          curl -fsSL "$BASE_URL/quote-book.html" -o /tmp/quote-book.html
          grep -F 'assets/js/pages/quote-book.js' /tmp/quote-book.html

          curl -fsSL "$BASE_URL/assets/js/pages/quote-book.js" -o /tmp/quote-book.js
          grep -F 'getSaddleSectionMetrics' /tmp/quote-book.js
          grep -F 'getPerfectInnerPricingMultiplier' /tmp/quote-book.js
          grep -F 'getPerfectBindingMetrics' /tmp/quote-book.js

          curl -fsSL "$BASE_URL/assets/js/pages/quote-book/saddle-calculator.js" -o /tmp/saddle-calculator.js
          grep -F 'export function getSaddleSheetsPerCopy' /tmp/saddle-calculator.js

          curl -fsSL "$BASE_URL/assets/js/pages/quote-book/perfect-calculator.js" -o /tmp/perfect-calculator.js
          grep -F 'export function getPerfectInnerPricingMultiplier' /tmp/perfect-calculator.js
          grep -F 'export function getPerfectBindingMetrics' /tmp/perfect-calculator.js
