name: Patch print guide image sync
on:
  push:
    branches: [fix/print-guide-image-sync]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-print-guide-image-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/print-guide-image-sync
      - name: Patch guide image persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/js/pages/quote-print-price.js')
          s = p.read_text()

          old = '''  async function saveGuide(){\n    const html = (el.guideEditor?.innerHTML || "").trim();\n    const text = htmlToPlainText(html);\n    await setDoc(doc(db, "settings", "print"), { guideHtml: html, guide: text, guideUpdatedAt: Date.now() }, { merge: true });\n    // 저장 성공 시 임시저장본 삭제\n    try{\n      localStorage.removeItem(GUIDE_DRAFT_KEY);\n      localStorage.removeItem(GUIDE_DRAFT_AT_KEY);\n    }catch(e){}\n    await loadGuide();\n    alert("안내문 저장 완료!");\n  }\n'''
          new = '''  async function persistGuideHtml(html){\n    const normalizedHtml = String(html || '').trim();\n    const text = htmlToPlainText(normalizedHtml);\n    await setDoc(doc(db, "settings", "print"), {\n      guideHtml: normalizedHtml,\n      guide: text,\n      guideUpdatedAt: Date.now()\n    }, { merge: true });\n    return normalizedHtml;\n  }\n\n  async function saveGuide(){\n    const html = (el.guideEditor?.innerHTML || "").trim();\n    await persistGuideHtml(html);\n    // 저장 성공 시 임시저장본 삭제\n    try{\n      localStorage.removeItem(GUIDE_DRAFT_KEY);\n      localStorage.removeItem(GUIDE_DRAFT_AT_KEY);\n    }catch(e){}\n    await loadGuide();\n    alert("안내문 저장 완료!");\n  }\n'''
          if old not in s:
              raise SystemExit('saveGuide marker not found')
          s = s.replace(old, new, 1)

          old2 = '''          editor.focus();\n          restoreSelection();\n          requestAnimationFrame(()=>{\n            try { document.execCommand('insertImage', false, url); } catch(err) {}\n            saveSelection();\n          });\n'''
          new2 = '''          editor.focus();\n          restoreSelection();\n          await new Promise((resolve) => {\n            requestAnimationFrame(()=>{\n              try { document.execCommand('insertImage', false, url); } catch(err) {}\n              saveSelection();\n              resolve();\n            });\n          });\n\n          // 이미지 첨부는 화면에만 보이고 저장되지 않는 상태가 생기지 않도록\n          // 삽입 직후 현재 안내문 HTML을 Firestore에 즉시 동기화합니다.\n          const savedHtml = await persistGuideHtml(editor.innerHTML || '');\n          if (el.guidePreview) el.guidePreview.innerHTML = savedHtml;\n          try{\n            localStorage.removeItem(GUIDE_DRAFT_KEY);\n            localStorage.removeItem(GUIDE_DRAFT_AT_KEY);\n          }catch(e){}\n'''
          if old2 not in s:
              raise SystemExit('image insert marker not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check assets/js/pages/quote-print-price.js
          grep -q "persistGuideHtml(editor.innerHTML" assets/js/pages/quote-print-price.js
          grep -q "guideHtml" assets/js/pages/quote-print.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/pages/quote-print-price.js
          git commit -m "Sync print guide images immediately [patched-print-guide-image-sync]"
          git push
