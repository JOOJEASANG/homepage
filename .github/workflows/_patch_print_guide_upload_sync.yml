name: Patch print guide upload sync
on:
  push:
    branches: [fix/print-guide-file-upload-sync]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-print-guide-upload]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/print-guide-file-upload-sync
      - name: Patch upload save
        shell: python
        run: |
          from pathlib import Path
          p=Path('assets/js/pages/quote-print-price.js')
          s=p.read_text(encoding='utf-8')
          old="""          editor.focus();
          restoreSelection();
          requestAnimationFrame(()=>{
            try { document.execCommand('insertImage', false, url); } catch(err) {}
            saveSelection();
          });"""
          new="""          editor.focus();
          restoreSelection();
          await new Promise((resolve) => {
            requestAnimationFrame(()=>{
              try { document.execCommand('insertImage', false, url); } catch(err) {}
              saveSelection();
              resolve();
            });
          });

          // 파일로 첨부한 이미지도 공개 디지털인쇄 페이지에서 바로 보이도록
          // 삽입 완료 후 이미지가 포함된 안내문 HTML을 Firestore에 즉시 저장합니다.
          const savedHtml = await persistGuideHtml(editor.innerHTML || '');
          if (el.guidePreview) el.guidePreview.innerHTML = savedHtml;
          try{
            localStorage.removeItem(GUIDE_DRAFT_KEY);
            localStorage.removeItem(GUIDE_DRAFT_AT_KEY);
          }catch(e){}"""
          # URL 삽입 쪽은 이미 await 버전이므로, 남아 있는 단순 requestAnimationFrame 블록 1개만 교체
          if old not in s:
              raise SystemExit('file upload insertion block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          node --check assets/js/pages/quote-print-price.js
          grep -q "파일로 첨부한 이미지도 공개 디지털인쇄 페이지" assets/js/pages/quote-print-price.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/quote-print-price.js
          git commit -m "fix: persist uploaded print guide images [patched-print-guide-upload]"
          git push