name: Patch print guide upload sync
on:
  push:
    branches: [fix/print-guide-file-upload-sync]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-print-guide-upload]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/print-guide-file-upload-sync
      - name: Patch upload save
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('assets/js/pages/quote-print-price.js')
          s=p.read_text(encoding='utf-8')
          anchor="const url = await getDownloadURL(r);"
          start=s.find(anchor)
          if start < 0: raise SystemExit('download url anchor not found')
          tail=s[start:]
          pattern=r"editor\.focus\(\);\s*restoreSelection\(\);\s*requestAnimationFrame\(\(\)=>\{\s*try \{ document\.execCommand\('insertImage', false, url\); \} catch\(err\) \{\}\s*saveSelection\(\);\s*\}\);"
          repl="""editor.focus();
          restoreSelection();
          await new Promise((resolve) => {
            requestAnimationFrame(()=>{
              try { document.execCommand('insertImage', false, url); } catch(err) {}
              saveSelection();
              resolve();
            });
          });

          // 파일 첨부 이미지도 안내문 HTML에 포함해 즉시 저장합니다.
          const savedHtml = await persistGuideHtml(editor.innerHTML || '');
          if (el.guidePreview) el.guidePreview.innerHTML = savedHtml;
          try{
            localStorage.removeItem(GUIDE_DRAFT_KEY);
            localStorage.removeItem(GUIDE_DRAFT_AT_KEY);
          }catch(e){}"""
          tail2,n=re.subn(pattern,repl,tail,count=1,flags=re.S)
          if n != 1: raise SystemExit('file upload insertion block not found')
          p.write_text(s[:start]+tail2,encoding='utf-8')
      - name: Validate
        run: |
          node --check assets/js/pages/quote-print-price.js
          grep -q "파일 첨부 이미지도 안내문 HTML에 포함" assets/js/pages/quote-print-price.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/quote-print-price.js
          git commit -m "fix: persist uploaded print guide images [patched-print-guide-upload]"
          git push