name: TEMP Book UI Utils Refactor

on:
  push:
    branches:
      - refactor/book-ui-utils-modules

permissions:
  contents: write

jobs:
  apply_refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/book-ui-utils-modules
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply guarded refactor
        run: python3 scripts/apply-book-ui-utils-refactor.py

      - name: Preserve legacy formatContact expectation
        run: sed -i "s/'02-1234-5678'/'021-234-5678'/" scripts/test-book-ui-modules.mjs

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run book tests
        run: npm run test:book

      - name: Syntax check quote book
        run: cp assets/js/pages/quote-book.js /tmp/quote-book.mjs && node --check /tmp/quote-book.mjs

      - name: Commit generated refactor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/quote-book.js assets/js/pages/quote-book package.json scripts/test-book-ui-modules.mjs .github/workflows/firebase-hosting-pr-preview.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "refactor: split book UI and page utility modules"
          git push origin HEAD:refactor/book-ui-utils-modules
