name: Patch size labels
on:
  push:
    branches: [fix/size-label-dimensions]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-size-labels]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/size-label-dimensions
      - name: Update size labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              Path('quote-print.html'): [
                  ('<option value="B5">B5 (176×250)</option>', '<option value="B5">B5 (182×257)</option>'),
              ],
              Path('assets/js/pages/quote-book.js'): [
                  ('<option value="1" selected>A4 (국배판)</option>', '<option value="1" selected>A4 (210×297)</option>'),
                  ('<option value="0.9">B5 (46배판)</option>', '<option value="0.9">B5 (182×257)</option>'),
                  ('<option value="1.8">B4 (타블로이드)</option>', '<option value="1.8">B4 (257×364)</option>'),
                  ('<option value="2">A3</option>', '<option value="2">A3 (297×420)</option>'),
              ],
              Path('assets/js/book-a5-size.js'): [
                  ('const expectedLabel = `A5 (국판 148×210) · A4의 ${percentText(a5Multiplier)}%`;', 'const expectedLabel = `A5 (148×210) · A4의 ${percentText(a5Multiplier)}%`;'),
              ],
          }

          for path, replacements in changes.items():
              s = path.read_text()
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'patch marker not found in {path}: {old}')
                  s = s.replace(old, new, 1)
              path.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quote-print.html assets/js/pages/quote-book.js assets/js/book-a5-size.js
          git commit -m "Show accurate dimensions in print and book sizes [patched-size-labels]"
          git push
