name: Patch binding direction options
on:
  push:
    branches: [feat/book-binding-direction]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-binding-direction]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/book-binding-direction
      - name: Patch files
        shell: python
        run: |
          from pathlib import Path

          p = Path('assets/js/pages/quote-book.js')
          s = p.read_text(encoding='utf-8')

          old = '''                        </div>\n                    </div>\n                    <div>\n                        <label class="block text-xs font-bold text-slate-500 mb-1">주문 수량 (부)</label>'''
          new = '''                        </div>\n                    </div>\n                    <div class="binding-direction-section hidden">\n                        <label class="block text-xs font-bold text-slate-500 mb-2">제본 방향 / 철 위치</label>\n                        <input type="hidden" name="bindingDirection" class="bindingDirection" value="portrait-left">\n                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 binding-direction-options">\n                            <button type="button" class="option-card" data-value="landscape-top">\n                                <div class="w-14 h-10 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">\n                                    <div class="absolute left-1 right-1 top-0 border-t-[3px] border-slate-700"></div>\n                                    <div class="absolute left-2 right-2 top-2 border-t border-dashed border-slate-200"></div>\n                                </div>\n                                <span class="title">가로상철</span>\n                                <span class="description">가로 · 위쪽 제본</span>\n                            </button>\n                            <button type="button" class="option-card" data-value="landscape-left">\n                                <div class="w-14 h-10 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">\n                                    <div class="absolute top-1 bottom-1 left-0 border-l-[3px] border-slate-700"></div>\n                                    <div class="absolute top-2 bottom-2 left-2 border-l border-dashed border-slate-200"></div>\n                                </div>\n                                <span class="title">가로좌철</span>\n                                <span class="description">가로 · 왼쪽 제본</span>\n                            </button>\n                            <button type="button" class="option-card selected" data-value="portrait-left">\n                                <div class="w-10 h-14 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">\n                                    <div class="absolute top-1 bottom-1 left-0 border-l-[3px] border-slate-700"></div>\n                                    <div class="absolute top-2 bottom-2 left-2 border-l border-dashed border-slate-200"></div>\n                                </div>\n                                <span class="title">세로좌철</span>\n                                <span class="description">세로 · 왼쪽 제본</span>\n                            </button>\n                            <button type="button" class="option-card" data-value="portrait-top">\n                                <div class="w-10 h-14 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">\n                                    <div class="absolute left-1 right-1 top-0 border-t-[3px] border-slate-700"></div>\n                                    <div class="absolute left-2 right-2 top-2 border-t border-dashed border-slate-200"></div>\n                                </div>\n                                <span class="title">세로상철</span>\n                                <span class="description">세로 · 위쪽 제본</span>\n                            </button>\n                        </div>\n                    </div>\n                    <div>\n                        <label class="block text-xs font-bold text-slate-500 mb-1">주문 수량 (부)</label>'''
          if old not in s: raise SystemExit('UI marker not found')
          s = s.replace(old, new, 1)

          old = '''            const bindingValue = data.bindingType || 'none';\n            newItem.querySelector('.bindingType').value = bindingValue;\n            newItem.querySelectorAll('.binding-options .option-card').forEach(card => {\n                card.classList.toggle('selected', card.dataset.value === bindingValue);\n            });\n            newItem.querySelector('.quantity').value = data.quantity || '1';'''
          new = '''            const bindingValue = data.bindingType || 'none';\n            newItem.querySelector('.bindingType').value = bindingValue;\n            newItem.querySelectorAll('.binding-options .option-card').forEach(card => {\n                card.classList.toggle('selected', card.dataset.value === bindingValue);\n            });\n            const bindingDirectionValue = data.bindingDirection || 'portrait-left';\n            newItem.querySelector('.bindingDirection').value = bindingDirectionValue;\n            newItem.querySelectorAll('.binding-direction-options .option-card').forEach(card => {\n                card.classList.toggle('selected', card.dataset.value === bindingDirectionValue);\n            });\n            newItem.querySelector('.binding-direction-section')?.classList.toggle('hidden', bindingValue === 'none');\n            newItem.querySelector('.quantity').value = data.quantity || '1';'''
          if old not in s: raise SystemExit('restore marker not found')
          s = s.replace(old, new, 1)

          old = '''            itemEl.querySelector('.bindingType').value = selectedCard.dataset.value;\n            calculateAndSave();\n        });\n    }'''
          new = '''            itemEl.querySelector('.bindingType').value = selectedCard.dataset.value;\n            itemEl.querySelector('.binding-direction-section')?.classList.toggle('hidden', selectedCard.dataset.value === 'none');\n            calculateAndSave();\n        });\n        const bindingDirectionOptions = itemEl.querySelector('.binding-direction-options');\n        bindingDirectionOptions?.addEventListener('click', (e) => {\n            const selectedCard = e.target.closest('.option-card');\n            if (!selectedCard) return;\n            bindingDirectionOptions.querySelectorAll('.option-card').forEach(card => card.classList.remove('selected'));\n            selectedCard.classList.add('selected');\n            itemEl.querySelector('.bindingDirection').value = selectedCard.dataset.value;\n            calculateAndSave();\n        });\n    }'''
          if old not in s: raise SystemExit('listener marker not found')
          s = s.replace(old, new, 1)

          s = s.replace("            itemData.bindingType = itemEl.querySelector('.bindingType').value;\n", "            itemData.bindingType = itemEl.querySelector('.bindingType').value;\n            itemData.bindingDirection = itemEl.querySelector('.bindingDirection')?.value || 'portrait-left';\n", 2)

          old = "            const selectedBindingType = itemEl.querySelector('.bindingType').value;\n            const largeSizeMultiplier"
          new = "            const selectedBindingType = itemEl.querySelector('.bindingType').value;\n            const bindingDirection = itemEl.querySelector('.bindingDirection')?.value || 'portrait-left';\n            itemEl.querySelector('.binding-direction-section')?.classList.toggle('hidden', selectedBindingType === 'none');\n            const bindingDirectionLabels = { 'landscape-top':'가로상철', 'landscape-left':'가로좌철', 'portrait-left':'세로좌철', 'portrait-top':'세로상철' };\n            const largeSizeMultiplier"
          if old not in s: raise SystemExit('calculate marker not found')
          s = s.replace(old, new, 1)

          old = '''                    itemBreakdownHtml += `<li><div class="flex justify-between"><span class="text-slate-700">- 제본 (${getSpecText('bindingType', bindingType)})</span><span class="text-slate-500 text-xs">${Math.round(bindingUnitPrice).toLocaleString()}원/부</span></div><div class="flex justify-end font-medium text-slate-800">${bindingCost.toLocaleString()}원</div></li>`;'''
          new = '''                    itemBreakdownHtml += `<li><div class="flex justify-between"><span class="text-slate-700">- 제본 (${getSpecText('bindingType', bindingType)} / ${bindingDirectionLabels[bindingDirection] || '세로좌철'})</span><span class="text-slate-500 text-xs">${Math.round(bindingUnitPrice).toLocaleString()}원/부</span></div><div class="flex justify-end font-medium text-slate-800">${bindingCost.toLocaleString()}원</div></li>`;'''
          if old not in s: raise SystemExit('breakdown marker not found')
          s = s.replace(old, new, 1)

          old = "                binding: (bindingType !== 'none') ? { type: bindingType, unitPrice:"
          new = "                binding: (bindingType !== 'none') ? { type: bindingType, direction: bindingDirection, directionLabel: bindingDirectionLabels[bindingDirection] || '세로좌철', unitPrice:"
          if old not in s: raise SystemExit('breakdown data marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          p = Path('assets/js/pages/admin.js')
          s = p.read_text(encoding='utf-8')
          old = '''                            <div class="bg-slate-100 p-3 rounded-lg border border-slate-200"><h5 class="font-bold text-slate-700 text-sm mb-1">📚 제본</h5><p class="text-sm font-medium text-slate-900">${getSpecText('binding', item.bindingType)}</p></div>'''
          new = '''                            <div class="bg-slate-100 p-3 rounded-lg border border-slate-200"><h5 class="font-bold text-slate-700 text-sm mb-1">📚 제본</h5><p class="text-sm font-medium text-slate-900">${getSpecText('binding', item.bindingType)}</p>${item.bindingType && item.bindingType !== 'none' ? `<p class="text-xs text-slate-500 mt-1">방향/철 위치: <span class="font-bold text-slate-700">${({ 'landscape-top':'가로상철', 'landscape-left':'가로좌철', 'portrait-left':'세로좌철', 'portrait-top':'세로상철' })[item.bindingDirection] || '세로좌철'}</span></p>` : ''}</div>'''
          if old not in s: raise SystemExit('admin marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: |
          node --check assets/js/pages/quote-book.js
          node --check assets/js/pages/admin.js
          grep -q "가로상철" assets/js/pages/quote-book.js
          grep -q "bindingDirection" assets/js/pages/admin.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/quote-book.js assets/js/pages/admin.js
          git commit -m "feat: add book binding direction options [patched-binding-direction]"
          git push
