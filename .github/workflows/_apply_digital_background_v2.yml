name: Apply digital full-background patch v2
on:
  push:
    branches: [feat/digital-full-background]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[patched-v2]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          html = Path('quote-print.html').read_text(encoding='utf-8')
          if 'id="fullBackgroundEnabled"' not in html:
            marker = '''                        <div class="flex items-center justify-between">\n                            <label class="flex items-center gap-2 cursor-pointer select-none">\n                                <input class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500" id="oshiEnabled" type="checkbox" />\n                                <span class="font-extrabold text-slate-700">오시(접는 선) 추가</span>\n                            </label>\n                            <span class="text-xs text-slate-400">리플렛/접지용 옵션</span>\n                        </div>'''
            if marker not in html: raise SystemExit('HTML marker missing')
            html = html.replace(marker, marker + '''\n                        <div class="mt-3 flex items-center justify-between">\n                            <label class="flex items-center gap-2 cursor-pointer select-none">\n                                <input class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500" id="fullBackgroundEnabled" type="checkbox" />\n                                <span class="font-extrabold text-slate-700">전체바탕색 추가</span>\n                            </label>\n                            <span class="text-xs text-slate-400">100원/매 · 사이즈별 적용</span>\n                        </div>''', 1)
            Path('quote-print.html').write_text(html, encoding='utf-8')

          p = Path('assets/js/pages/quote-print.js')
          js = p.read_text(encoding='utf-8')
          def rep(old,new):
              global js
              if old in js: js = js.replace(old,new,1)
          rep("        oshiEnabled: document.getElementById('oshiEnabled').checked,\n        oshiLines:", "        oshiEnabled: document.getElementById('oshiEnabled').checked,\n        fullBackgroundEnabled: document.getElementById('fullBackgroundEnabled')?.checked || false,\n        oshiLines:")
          rep("      oshiEnabled: document.getElementById('oshiEnabled'),\n      oshiOptions:", "      oshiEnabled: document.getElementById('oshiEnabled'),\n      fullBackgroundEnabled: document.getElementById('fullBackgroundEnabled'),\n      oshiOptions:")
          rep("      const oshiLines = getOshiLines();\n\n      el.minQtyHint", "      const oshiLines = getOshiLines();\n      const fullBackgroundEnabled = !!el.fullBackgroundEnabled?.checked;\n\n      el.minQtyHint")
          rep("        oshiCost = oshiUnit * qty * mul;\n      }\n\n      const supplyRaw = basePrint + oshiCost;", "        oshiCost = oshiUnit * qty * mul;\n      }\n\n      const fullBackgroundUnit = 100;\n      const fullBackgroundCost = fullBackgroundEnabled ? fullBackgroundUnit * qty * mul : 0;\n\n      const supplyRaw = basePrint + oshiCost + fullBackgroundCost;")
          rep("        html += `<div class=\"flex justify-between\"><span class=\"text-slate-500\">오시비</span><span class=\"font-extrabold text-slate-800\">${Math.round(oshiCost).toLocaleString()}원</span></div>`;\n      }\n      html += `<div", "        html += `<div class=\"flex justify-between\"><span class=\"text-slate-500\">오시비</span><span class=\"font-extrabold text-slate-800\">${Math.round(oshiCost).toLocaleString()}원</span></div>`;\n      }\n      if (fullBackgroundEnabled){\n        html += `<div class=\"flex justify-between\"><span class=\"text-slate-500\">전체바탕색</span><span class=\"font-bold\">${fullBackgroundUnit.toLocaleString()}원/매 × ${qty.toLocaleString()}매 × ${mul.toFixed(3)}</span></div>`;\n        html += `<div class=\"flex justify-between\"><span class=\"text-slate-500\">전체바탕색비</span><span class=\"font-extrabold text-slate-800\">${Math.round(fullBackgroundCost).toLocaleString()}원</span></div>`;\n      }\n      html += `<div")
          rep("      return { ok:true, supply, vat, total, unitPrice: unit.price, mul, specKey, oshiLines, oshiCost, basePrint, supplyRaw, totalRaw, totalRounded, roundingUnit, roundingDiff };", "      return { ok:true, supply, vat, total, unitPrice: unit.price, mul, specKey, oshiLines, oshiCost, fullBackgroundEnabled, fullBackgroundUnit, fullBackgroundCost, basePrint, supplyRaw, totalRaw, totalRounded, roundingUnit, roundingDiff };")
          rep("    }\n\n    // 버튼 문구 변경 (수정 모드임을 인지)", "    }\n    const bgChk = document.getElementById('fullBackgroundEnabled');\n    if (bgChk) bgChk.checked = !!s.fullBackgroundEnabled;\n\n    // 버튼 문구 변경 (수정 모드임을 인지)")
          rep("      oshiEnabled: data.options?.oshiEnabled ?? null,\n      oshiLines:", "      oshiEnabled: data.options?.oshiEnabled ?? null,\n      fullBackgroundEnabled: data.options?.fullBackgroundEnabled ?? null,\n      oshiLines:")
          rep("        if (s.oshiEnabled != null) el.oshiEnabled.checked = !!s.oshiEnabled;\n        if (s.oshiLines", "        if (s.oshiEnabled != null) el.oshiEnabled.checked = !!s.oshiEnabled;\n        if (s.fullBackgroundEnabled != null && el.fullBackgroundEnabled) el.fullBackgroundEnabled.checked = !!s.fullBackgroundEnabled;\n        if (s.oshiLines")
          rep("        const oshiEnabled = !!el.oshiEnabled.checked;\n        const oshiLines", "        const oshiEnabled = !!el.oshiEnabled.checked;\n        const fullBackgroundEnabled = !!el.fullBackgroundEnabled?.checked;\n        const oshiLines")
          rep("            oshiEnabled,\n            oshiLines,", "            oshiEnabled,\n            fullBackgroundEnabled,\n            oshiLines,")
          rep("          oshiCost: calc.oshiCost,\n          breakdownHtml:", "          oshiCost: calc.oshiCost,\n          fullBackgroundEnabled: calc.fullBackgroundEnabled,\n          fullBackgroundUnit: calc.fullBackgroundUnit,\n          fullBackgroundCost: calc.fullBackgroundCost,\n          breakdownHtml:")
          rep("unitPrice: calc.unitPrice, mul: calc.mul, sides, basePrint: calc.basePrint, oshiLines, oshiCost: calc.oshiCost,", "unitPrice: calc.unitPrice, mul: calc.mul, sides, basePrint: calc.basePrint, oshiLines, oshiCost: calc.oshiCost, fullBackgroundEnabled: calc.fullBackgroundEnabled, fullBackgroundUnit: calc.fullBackgroundUnit, fullBackgroundCost: calc.fullBackgroundCost,")
          rep("              오시: (oshiLines > 0 ? `${oshiLines}줄` : '없음'),\n              '사이즈계수':", "              오시: (oshiLines > 0 ? `${oshiLines}줄` : '없음'),\n              전체바탕색: (fullBackgroundEnabled ? `${calc.fullBackgroundUnit.toLocaleString()}원/매` : '없음'),\n              '사이즈계수':")
          rep("              basePrint: calc.basePrint,\n              oshiCost: calc.oshiCost", "              basePrint: calc.basePrint,\n              oshiCost: calc.oshiCost,\n              fullBackgroundEnabled: calc.fullBackgroundEnabled,\n              fullBackgroundUnit: calc.fullBackgroundUnit,\n              fullBackgroundCost: calc.fullBackgroundCost")
          rep("          oshiEnabled: !!el.oshiEnabled.checked,\n          oshiLines:", "          oshiEnabled: !!el.oshiEnabled.checked,\n          fullBackgroundEnabled: !!el.fullBackgroundEnabled?.checked,\n          oshiLines:")
          rep("    el.oshiEnabled.addEventListener('change', ()=>{ toggleOshi(); compute(); });", "    el.oshiEnabled.addEventListener('change', ()=>{ toggleOshi(); compute(); });\n    el.fullBackgroundEnabled?.addEventListener('change', compute);")
          rep("          document.getElementById('oshiEnabled').checked = !!d.oshiEnabled;\n          toggleOshi();", "          document.getElementById('oshiEnabled').checked = !!d.oshiEnabled;\n          const bg = document.getElementById('fullBackgroundEnabled');\n          if (bg) bg.checked = !!d.fullBackgroundEnabled;\n          toggleOshi();")
          if 'fullBackgroundEnabled' not in js: raise SystemExit('patch verification failed')
          p.write_text(js, encoding='utf-8')
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quote-print.html assets/js/pages/quote-print.js
          git commit -m "feat: add digital print full background option [patched-v2]"
          git push origin HEAD:feat/digital-full-background
