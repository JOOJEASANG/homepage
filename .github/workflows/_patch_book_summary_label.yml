name: Patch book summary label
on:
  push:
    branches: [fix/book-summary-label]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-book-summary-label]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/book-summary-label
      - name: Update label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('quote-book.html')
          s = p.read_text()
          old = '<h3 class="font-bold text-slate-800">예상 견적서</h3>'
          new = '<h3 class="font-bold text-slate-800">금액산출</h3>'
          if old not in s:
              raise SystemExit('label marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quote-book.html
          git commit -m "Rename book quote summary to amount calculation [patched-book-summary-label]"
          git push
