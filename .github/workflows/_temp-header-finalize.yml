name: Temporary header finalize

on:
  push:
    branches: [fix/header-final-validation]

permissions:
  contents: write

jobs:
  patch_and_verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/header-final-validation
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply guarded header patch
        run: python3 scripts/_temp_header_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Run integrated contracts
        run: npm run test:ci

      - name: Syntax check fallback header
        run: node --check assets/js/header-shell.js

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quote-book.html quote-print.html qna.html assets/js/header-shell.js tests/e2e/public-pages.spec.mjs scripts/test-header-shell-contract.mjs package.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "fix: keep shared header visible across public pages"
          git push origin HEAD:fix/header-final-validation
