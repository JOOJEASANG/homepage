name: Validate / Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/firebase-functions-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Functions Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Refresh security-fixed Functions lockfile
        working-directory: functions
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Audit Functions dependencies
        working-directory: functions
        run: npm audit

      - name: Syntax check Functions entrypoint
        working-directory: functions
        run: node --check main.js && node --check qna-api.js && node --check index.js

      - name: Load Functions module
        working-directory: functions
        run: node -e "const m=require('./main.js'); if(!m.qnaSecure||!m.guestQuoteAccess||!m.aiChat||!m.aiChatConfig) process.exit(1); console.log('functions module load passed')"

      - name: Validate customer deployment entrypoint
        working-directory: functions
        run: |
          node --check customer-access.js
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const endpoints = require('./customer-access.js');
          assert.deepEqual(Object.keys(endpoints).sort(), ['guestQuoteAccess', 'qnaSecure']);
          for (const endpoint of Object.values(endpoints)) {
            assert.equal((endpoint.__endpoint.secretEnvironmentVariables || []).length, 0);
            assert.equal(endpoint.__endpoint.serviceAccountEmail, 'worklist-1e83a@appspot.gserviceaccount.com');
          }
          assert.equal(require.cache[require.resolve('./ai-api.js')], undefined);
          assert.equal(require.cache[require.resolve('./index.js')], undefined);
          console.log('Customer endpoints load without AI modules or secrets');
          NODE

  deploy_functions:
    if: github.ref == 'refs/heads/main'
    needs: validate_functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Functions Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Refresh security-fixed Functions lockfile
        working-directory: functions
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Configure Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_FILE"
          chmod 600 "$CREDENTIALS_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"

      - name: Select customer-only deployment entrypoint
        working-directory: functions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.main = 'customer-access.js';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Deploy guest lookup and secure Q&A endpoints
        run: npx --yes firebase-tools@latest deploy --only functions:guestQuoteAccess,functions:qnaSecure --project worklist-1e83a --non-interactive
