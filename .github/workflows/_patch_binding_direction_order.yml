name: Patch binding direction order
on:
  push:
    branches: [feat/book-binding-direction-order]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-binding-direction-order]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/book-binding-direction-order
      - name: Patch order
        shell: python
        run: |
          from pathlib import Path
          p=Path('assets/js/pages/quote-book.js')
          s=p.read_text(encoding='utf-8')
          marker='<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 binding-direction-options">'
          scope=s.find(marker)
          if scope < 0:
              raise SystemExit('binding direction container not found')
          def button_block(value):
              pos=s.find(f'data-value="{value}"', scope)
              if pos < 0:
                  raise SystemExit(f'{value} not found')
              start=s.rfind('<button', scope, pos)
              end=s.find('</button>', pos)
              if start < 0 or end < 0:
                  raise SystemExit(f'{value} button bounds not found')
              end += len('</button>')
              return start, end, s[start:end]
          values=['landscape-top','landscape-left','portrait-left','portrait-top']
          found={v:button_block(v) for v in values}
          region_start=min(x[0] for x in found.values())
          region_end=max(x[1] for x in found.values())
          order=['portrait-left','portrait-top','landscape-top','landscape-left']
          indent='                            '
          reordered=('\n'+indent).join(found[v][2] for v in order)
          s=s[:region_start]+reordered+s[region_end:]
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          node --check assets/js/pages/quote-book.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/js/pages/quote-book.js').read_text(encoding='utf-8')
          scope=s.index('binding-direction-options')
          a=s.index('data-value="portrait-left"',scope)
          b=s.index('data-value="portrait-top"',a)
          c=s.index('data-value="landscape-top"',b)
          d=s.index('data-value="landscape-left"',c)
          assert a < b < c < d
          assert 'name="bindingDirection" class="bindingDirection" value="portrait-left"' in s
          assert 'option-card selected" data-value="portrait-left"' in s[a-80:a+80]
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/quote-book.js
          git commit -m "chore: reorder binding direction options [patched-binding-direction-order]"
          git push