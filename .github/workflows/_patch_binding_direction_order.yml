name: Patch binding direction order
on:
  push:
    branches: [feat/book-binding-direction-order]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-binding-direction-order]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/book-binding-direction-order
      - name: Patch order
        shell: python
        run: |
          from pathlib import Path
          p=Path('assets/js/pages/quote-book.js')
          s=p.read_text(encoding='utf-8')
          old='''                            <button type="button" class="option-card" data-value="landscape-top">
                                <div class="w-14 h-10 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">
                                    <div class="absolute left-1 right-1 top-0 border-t-[3px] border-slate-700"></div>
                                    <div class="absolute left-2 right-2 top-2 border-t border-dashed border-slate-200"></div>
                                </div>
                                <span class="title">가로상철</span>
                                <span class="description">가로 · 위쪽 제본</span>
                            </button>
                            <button type="button" class="option-card" data-value="landscape-left">
                                <div class="w-14 h-10 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">
                                    <div class="absolute top-1 bottom-1 left-0 border-l-[3px] border-slate-700"></div>
                                    <div class="absolute top-2 bottom-2 left-2 border-l border-dashed border-slate-200"></div>
                                </div>
                                <span class="title">가로좌철</span>
                                <span class="description">가로 · 왼쪽 제본</span>
                            </button>
                            <button type="button" class="option-card selected" data-value="portrait-left">
                                <div class="w-10 h-14 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">
                                    <div class="absolute top-1 bottom-1 left-0 border-l-[3px] border-slate-700"></div>
                                    <div class="absolute top-2 bottom-2 left-2 border-l border-dashed border-slate-200"></div>
                                </div>
                                <span class="title">세로좌철</span>
                                <span class="description">세로 · 왼쪽 제본</span>
                            </button>
                            <button type="button" class="option-card" data-value="portrait-top">
                                <div class="w-10 h-14 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">
                                    <div class="absolute left-1 right-1 top-0 border-t-[3px] border-slate-700"></div>
                                    <div class="absolute left-2 right-2 top-2 border-t border-dashed border-slate-200"></div>
                                </div>
                                <span class="title">세로상철</span>
                                <span class="description">세로 · 위쪽 제본</span>
                            </button>'''
          new='''                            <button type="button" class="option-card selected" data-value="portrait-left">
                                <div class="w-10 h-14 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">
                                    <div class="absolute top-1 bottom-1 left-0 border-l-[3px] border-slate-700"></div>
                                    <div class="absolute top-2 bottom-2 left-2 border-l border-dashed border-slate-200"></div>
                                </div>
                                <span class="title">세로좌철</span>
                                <span class="description">세로 · 왼쪽 제본</span>
                            </button>
                            <button type="button" class="option-card" data-value="portrait-top">
                                <div class="w-10 h-14 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">
                                    <div class="absolute left-1 right-1 top-0 border-t-[3px] border-slate-700"></div>
                                    <div class="absolute left-2 right-2 top-2 border-t border-dashed border-slate-200"></div>
                                </div>
                                <span class="title">세로상철</span>
                                <span class="description">세로 · 위쪽 제본</span>
                            </button>
                            <button type="button" class="option-card" data-value="landscape-top">
                                <div class="w-14 h-10 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">
                                    <div class="absolute left-1 right-1 top-0 border-t-[3px] border-slate-700"></div>
                                    <div class="absolute left-2 right-2 top-2 border-t border-dashed border-slate-200"></div>
                                </div>
                                <span class="title">가로상철</span>
                                <span class="description">가로 · 위쪽 제본</span>
                            </button>
                            <button type="button" class="option-card" data-value="landscape-left">
                                <div class="w-14 h-10 mb-2 bg-white border border-slate-300 rounded-sm relative shadow-sm">
                                    <div class="absolute top-1 bottom-1 left-0 border-l-[3px] border-slate-700"></div>
                                    <div class="absolute top-2 bottom-2 left-2 border-l border-dashed border-slate-200"></div>
                                </div>
                                <span class="title">가로좌철</span>
                                <span class="description">가로 · 왼쪽 제본</span>
                            </button>'''
          if old not in s:
              raise SystemExit('direction block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate
        run: |
          node --check assets/js/pages/quote-book.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/js/pages/quote-book.js').read_text(encoding='utf-8')
          a=s.index('data-value="portrait-left"')
          b=s.index('data-value="portrait-top"',a)
          c=s.index('data-value="landscape-top"',b)
          d=s.index('data-value="landscape-left"',c)
          assert a < b < c < d
          assert 'name="bindingDirection" class="bindingDirection" value="portrait-left"' in s
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/quote-book.js
          git commit -m "chore: reorder binding direction options [patched-binding-direction-order]"
          git push