name: Patch book size rate to inner only
on:
  push:
    branches: [fix/book-size-rate-inner-only]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-inner-only]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/book-size-rate-inner-only
      - name: Patch quote-book calculation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/js/pages/quote-book.js')
          s = p.read_text()

          replacements = [
          ('''            // 책 전체 규격은 첫 번째 내지 규격을 기준으로 합니다.\n            // A4=100%를 기준으로 표지·내지·간지·제본·오시까지 같은 배율을 적용합니다.\n''', '''            // 규격별 배율은 내지 인쇄비에만 적용합니다.\n            // 표지·간지·제본·오시는 규격과 관계없이 기본 단가를 사용합니다.\n'''),
          ('''            const isA5 = primarySizeSelect?.value === 'a5';\n  const isA5Saddle = isA5 && selectedBindingType === 'saddle';\n  const isA5PerfectOrWire = isA5 && (selectedBindingType === 'perfect' || selectedBindingType === 'wire');\n  // A5 인쇄비만 제본 방식에 따라 별도 배율 적용:\n  // 중철 60%, 무선/와이어 70%. 제본/간지/오시 등 작업비는 기존 A5 배율을 유지합니다.\n  const printSizeMultiplier = isA5Saddle ? 0.60 : (isA5PerfectOrWire ? 0.70 : itemSizeMultiplier);\n''', '''            // A5 내지 인쇄비는 제본 방식에 따라 별도 배율(중철 60%, 무선/와이어 70%)을 적용합니다.\n'''),
          ('''                coverUnitPrice = findPriceTier(coverTiers, quantity) * printSizeMultiplier;\n''', '''                coverUnitPrice = findPriceTier(coverTiers, quantity);\n'''),
          ('''                interleafUnitPrice = findPriceTier(interleafTiers, totalInterleafSheets) * itemSizeMultiplier;\n''', '''                interleafUnitPrice = findPriceTier(interleafTiers, totalInterleafSheets);\n'''),
          ('''                bindingUnitPrice = findBindingPriceTier(bindingTiers, quantity, actualTotalPages) * itemSizeMultiplier;\n''', '''                bindingUnitPrice = findBindingPriceTier(bindingTiers, quantity, actualTotalPages);\n'''),
          ('''                etcOshiCost = Math.floor((((priceConfig.etc.coverOshi || 0) * itemSizeMultiplier) * quantity) / 100) * 100; // 규격 배율 적용 후 100원 단위 절삭\n''', '''                etcOshiCost = Math.floor(((priceConfig.etc.coverOshi || 0) * quantity) / 100) * 100; // 100원 단위 절삭\n''')]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('patch marker not found: ' + old[:80])
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/pages/quote-book.js
          git commit -m "Apply size rates to inner pages only [patched-inner-only]"
          git push
