name: Validate / Deploy Firebase security rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'firebase.emulators.json'
      - 'tests/security/**'
      - '.github/workflows/firebase-security-rules-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install security test dependencies
        run: npm ci --prefix tests/security

      - name: Test Firestore and Storage authorization
        shell: bash
        run: npx --yes firebase-tools@latest emulators:exec --config firebase.emulators.json --only firestore,storage --project demo-greenoffice "npm test --prefix tests/security"

  deploy_rules:
    if: github.ref == 'refs/heads/main'
    needs: validate_rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Write Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firestore rules
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project worklist-1e83a --non-interactive

      - name: Deploy Storage rules
        if: always()
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx --yes firebase-tools@latest deploy --only storage --project worklist-1e83a --non-interactive
