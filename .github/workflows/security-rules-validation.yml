name: Validate Firebase security rules

on:
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'firebase.emulators.json'
      - 'tests/security/**'
      - '.github/workflows/security-rules-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install security test dependencies
        run: npm ci --prefix tests/security
      - name: Test Firestore and Storage authorization
        shell: bash
        run: npx --yes firebase-tools@latest emulators:exec --config firebase.emulators.json --only firestore,storage --project demo-greenoffice "npm test --prefix tests/security"
