name: Apply book size pricing patch

on:
  push:
    branches:
      - fix/book-size-all-pricing
    paths:
      - .github/workflows/apply-book-size-pricing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/book-size-all-pricing
          fetch-depth: 0

      - name: Apply size multiplier to all size-sensitive book costs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/js/pages/quote-book.js')
          s = p.read_text(encoding='utf-8')

          marker = "const itemSizeMultiplier = Number.isFinite(rawItemSizeMultiplier)"
          if marker not in s:
              old = """            const quantity = parseInt(itemEl.querySelector('.quantity').value) || 0;\n            if (quantity === 0) return;\n\n            let itemTotalPrice = 0;\n"""
              new = """            const quantity = parseInt(itemEl.querySelector('.quantity').value) || 0;\n            if (quantity === 0) return;\n\n            // 책 전체 규격은 첫 번째 내지 규격을 기준으로 합니다.\n            // A4=100%를 기준으로 표지·내지·간지·제본·오시까지 같은 배율을 적용합니다.\n            const primarySizeSelect = itemEl.querySelector('.inner-section .paperSize');\n            const rawItemSizeMultiplier = primarySizeSelect ? parseFloat(primarySizeSelect.value) : 1;\n            const itemSizeMultiplier = Number.isFinite(rawItemSizeMultiplier) && rawItemSizeMultiplier > 0\n                ? rawItemSizeMultiplier\n                : 1;\n\n            let itemTotalPrice = 0;\n"""
              if old not in s:
                  raise SystemExit('quantity anchor not found')
              s = s.replace(old, new, 1)

          replacements = [
              (
                  "                coverUnitPrice = findPriceTier(coverTiers, quantity);",
                  "                coverUnitPrice = findPriceTier(coverTiers, quantity) * itemSizeMultiplier;"
              ),
              (
                  "                interleafUnitPrice = findPriceTier(interleafTiers, totalInterleafSheets);",
                  "                interleafUnitPrice = findPriceTier(interleafTiers, totalInterleafSheets) * itemSizeMultiplier;"
              ),
              (
                  "                bindingUnitPrice = findBindingPriceTier(bindingTiers, quantity, actualTotalPages);",
                  "                bindingUnitPrice = findBindingPriceTier(bindingTiers, quantity, actualTotalPages) * itemSizeMultiplier;"
              ),
              (
                  "                etcOshiCost = Math.floor(((priceConfig.etc.coverOshi || 0) * quantity) / 100) * 100; // 100원 단위 절삭",
                  "                etcOshiCost = Math.floor((((priceConfig.etc.coverOshi || 0) * itemSizeMultiplier) * quantity) / 100) * 100; // 규격 배율 적용 후 100원 단위 절삭"
              ),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'pricing anchor not found: {old}')

          p.write_text(s, encoding='utf-8')

          p = Path('assets/js/book-a5-rate-admin.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'A4 내지 인쇄 단가를 100%로 보고 A5에 적용할 비율입니다. 작은 규격은 재단·정합·제본 작업성이 떨어지므로 기본값은 85%입니다.\n            제본비·표지 디자인·오시 등 고정 작업비에는 이 비율을 적용하지 않습니다.',
              'A4 규격을 100%로 보고 A5에 적용할 비율입니다. 작은 규격은 재단·정합·제본 작업성이 떨어지므로 기본값은 85%입니다.\n            내지·표지·간지·제본·오시처럼 규격 영향을 받는 비용에는 같은 비율을 적용하고, 표지 디자인비 같은 고정 작업비는 그대로 유지합니다.'
          )
          s = s.replace(
              '예: A4 내지금액 100,000원 → A5 85% 설정 시 85,000원',
              '예: A4 기준 규격비 100,000원 → A5 85% 설정 시 85,000원'
          )
          p.write_text(s, encoding='utf-8')

          p = Path('assets/js/book-a5-size.js')
          s = p.read_text(encoding='utf-8')
          sync_marker = 'function syncBookItemPaperSizes(event)'
          if sync_marker not in s:
              anchor = """function initObserver() {\n"""
              block = """// 한 책자 항목 안에서는 모든 내지 구간의 규격을 동일하게 유지합니다.\n// 어느 구간에서 규격을 바꾸더라도 표지/제본 기준과 내지 규격이 어긋나지 않게 합니다.\nfunction syncBookItemPaperSizes(event) {\n  const select = event.target?.closest?.('select.paperSize');\n  if (!select) return;\n  const item = select.closest('.quote-item');\n  if (!item) return;\n  const value = select.value;\n  item.querySelectorAll('select.paperSize').forEach(other => {\n    if (other !== select && other.value !== value) other.value = value;\n  });\n}\n\nfunction inheritSizeForNewInnerSection(event) {\n  const button = event.target?.closest?.('.add-inner-section-btn');\n  if (!button) return;\n  const item = button.closest('.quote-item');\n  const baseValue = item?.querySelector('select.paperSize')?.value;\n  if (!item || !baseValue) return;\n  setTimeout(() => {\n    const selects = Array.from(item.querySelectorAll('select.paperSize'));\n    const newest = selects[selects.length - 1];\n    if (newest && newest.value !== baseValue) {\n      newest.value = baseValue;\n      try { newest.dispatchEvent(new Event('change', { bubbles: true })); } catch (_) {}\n    }\n  }, 0);\n}\n\ndocument.addEventListener('change', syncBookItemPaperSizes, true);\ndocument.addEventListener('click', inheritSizeForNewInnerSection, true);\n\n"""
              if anchor not in s:
                  raise SystemExit('A5 size observer anchor not found')
              s = s.replace(anchor, block + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/quote-book.js assets/js/book-a5-rate-admin.js assets/js/book-a5-size.js
          git commit -m "Apply A4-based size multiplier to book pricing"
          git push origin HEAD:fix/book-size-all-pricing
