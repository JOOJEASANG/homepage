name: Apply A5 saddle print rate patch

on:
  push:
    branches: [fix/a5-saddle-print-rate]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch A5 saddle print multiplier
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/js/pages/quote-book.js')
          s = p.read_text(encoding='utf-8')

          old = """            const itemSizeMultiplier = Number.isFinite(rawItemSizeMultiplier) && rawItemSizeMultiplier > 0\n                ? rawItemSizeMultiplier\n                : 1;\n\n            let itemTotalPrice = 0;"""
          new = """            const itemSizeMultiplier = Number.isFinite(rawItemSizeMultiplier) && rawItemSizeMultiplier > 0\n                ? rawItemSizeMultiplier\n                : 1;\n            const selectedBindingType = itemEl.querySelector('.bindingType').value;\n            const isA5Saddle = primarySizeSelect?.value === 'a5' && selectedBindingType === 'saddle';\n            // A5 중철은 2-up 출력 효율을 반영해 인쇄 관련 비용만 A4의 60%로 계산합니다.\n            // 제본/간지/오시 등 작업비는 기존 A5 배율(관리자 설정, 기본 85%)을 유지합니다.\n            const printSizeMultiplier = isA5Saddle ? 0.60 : itemSizeMultiplier;\n\n            let itemTotalPrice = 0;"""
          if old not in s: raise SystemExit('marker 1 not found')
          s = s.replace(old, new, 1)

          old = "coverUnitPrice = findPriceTier(coverTiers, quantity) * itemSizeMultiplier;"
          new = "coverUnitPrice = findPriceTier(coverTiers, quantity) * printSizeMultiplier;"
          if old not in s: raise SystemExit('marker 2 not found')
          s = s.replace(old, new, 1)

          old = """                const sizeMultiplier = parseFloat(section.querySelector('.paperSize').value);\n                const pages = parseInt(section.querySelector('.innerPages').value) || 0;"""
          new = """                const sectionSizeValue = section.querySelector('.paperSize').value;\n                const normalSizeMultiplier = parseFloat(sectionSizeValue);\n                const sizeMultiplier = (selectedBindingType === 'saddle' && sectionSizeValue === 'a5')\n                    ? 0.60\n                    : normalSizeMultiplier;\n                const pages = parseInt(section.querySelector('.innerPages').value) || 0;"""
          if old not in s: raise SystemExit('marker 3 not found')
          s = s.replace(old, new, 1)

          old = "const bindingType = itemEl.querySelector('.bindingType').value;"
          new = "const bindingType = selectedBindingType;"
          if old not in s: raise SystemExit('marker 4 not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/quote-book.js
          git commit -m "fix: lower A5 saddle print rate to 60 percent [patched]"
          git push
