name: TEMP Dependency Audit

on:
  push:
    branches:
      - chore/ci-security-cleanup

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/ci-security-cleanup
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix
      - name: Refresh Browserslist database
        run: npx update-browserslist-db@latest
      - name: Require zero npm audit findings
        run: npm audit
      - name: Regression tests
        run: npm run test:book
      - name: CSS build
        run: npm run build:css
      - name: Syntax check book entrypoint
        run: node --check assets/js/pages/quote-book.js
      - name: Commit lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency metadata changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: patch dependency vulnerabilities"
          git push origin HEAD:chore/ci-security-cleanup
