name: TEMP Dependency Audit

on:
  push:
    branches:
      - chore/ci-security-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Versions
        run: |
          node --version
          npm --version
          npm ls --depth=0 || true
      - name: Audit current lockfile
        run: npm audit --json || true
      - name: Audit fix dry run
        run: npm audit fix --dry-run || true
      - name: Outdated packages
        run: npm outdated || true
      - name: Regression tests
        run: npm run test:book
      - name: CSS build
        run: npm run build:css
