name: Patch digital print size billing
on:
  push:
    branches: [fix-digital-print-size-billing]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-digital-size]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-digital-print-size-billing
      - name: Patch size multiplier logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/js/pages/quote-print.js')
          s = p.read_text()

          old = '''      // Custom size -> area ratio (A4 기준) + 최소계수\n      if (size === 'CUSTOM') {\n        const w = Number(cw) || 0;\n        const h = Number(ch) || 0;\n        if (w <= 0 || h <= 0) return 0;\n\n        const ok = (w <= MAX_W && h <= MAX_H) || (w <= MAX_H && h <= MAX_W);\n        if (!ok) {\n          throw new Error('디지털 인쇄 최대 사이즈는 13×19인치(482×330mm) 이하입니다.');\n        }\n        const areaCustom = w * h;\n        const mulCustom = areaCustom / A4_AREA;\n        return Math.max(mulCustom, minMul);\n      }\n\n      // Preset override (admin-configurable)\n      if (preset && preset[size] != null) {\n        const v = Number(preset[size]) || 0;\n        return Math.max(v, minMul);\n      }\n'''

          new = '''      const configuredA4 = Math.max(Number(preset?.A4 ?? 1) || 1, minMul);\n      const configuredA3 = Math.max(Number(preset?.A3 ?? 2) || 2, minMul);\n\n      // 디지털 출력 판형 기준: B5는 A4 단가, B4는 A3 단가로 계산합니다.\n      if (size === 'B5') return configuredA4;\n      if (size === 'B4') return configuredA3;\n\n      // 직접입력은 실제 가로×세로를 판형에 맞춰 자동 계산합니다.\n      // A4 이하면 A4, A3 이하면 A3, A3 초과는 실제 면적비(최소 A3 단가)로 계산합니다.\n      if (size === 'CUSTOM') {\n        const w = Number(cw) || 0;\n        const h = Number(ch) || 0;\n        if (w <= 0 || h <= 0) return 0;\n\n        const ok = (w <= MAX_W && h <= MAX_H) || (w <= MAX_H && h <= MAX_W);\n        if (!ok) {\n          throw new Error('디지털 인쇄 최대 사이즈는 13×19인치(482×330mm) 이하입니다.');\n        }\n\n        const shortSide = Math.min(w, h);\n        const longSide = Math.max(w, h);\n        if (shortSide <= 210 && longSide <= 297) return configuredA4;\n        if (shortSide <= 297 && longSide <= 420) return configuredA3;\n\n        const areaCustom = w * h;\n        const mulCustom = areaCustom / A4_AREA;\n        return Math.max(mulCustom, configuredA3, minMul);\n      }\n\n      // Preset override (admin-configurable)\n      if (preset && preset[size] != null) {\n        const v = Number(preset[size]) || 0;\n        return Math.max(v, minMul);\n      }\n'''

          if old not in s:
              raise SystemExit('patch marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/pages/quote-print.js
          git commit -m "Apply print-sheet size billing rules [patched-digital-size]"
          git push
