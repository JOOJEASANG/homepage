name: TEMP Functions Audit

on:
  push:
    branches:
      - chore/ci-security-cleanup

permissions:
  contents: write

jobs:
  audit_functions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/ci-security-cleanup
      - name: Setup Functions Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply guarded Admin 14 migration
        run: python3 scripts/apply-functions-admin14.py
      - name: Generate reproducible Functions lockfile
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Require zero Functions audit findings
        working-directory: functions
        run: npm audit
      - name: Syntax check Functions entrypoint
        working-directory: functions
        run: node --check index.js
      - name: Load Functions module
        working-directory: functions
        run: node -e "const m=require('./index.js'); if(!m.aiChat||!m.aiChatConfig) process.exit(1); console.log('functions module load passed')"
      - name: Commit validated Functions migration
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/index.js functions/package-lock.json
          if git diff --cached --quiet; then
            echo "No Functions changes to commit"
            exit 0
          fi
          git commit -m "chore: secure Firebase Functions dependencies"
          git push origin HEAD:chore/ci-security-cleanup
