name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Functions Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Audit Functions dependencies
        working-directory: functions
        run: npm audit

      - name: Syntax check Functions entrypoint
        working-directory: functions
        run: node --check index.js && node --check guest-access.js

      - name: Load Functions module
        working-directory: functions
        run: node -e "const m=require('./index.js'); if(!m.aiChat||!m.aiChatConfig||!m.guestQuoteAccess) process.exit(1); console.log('functions module load passed')"

  build_and_deploy:
    needs: validate_functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Test application contracts
        run: npm run test:ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Syntax check book entrypoint
        run: node --check assets/js/pages/quote-book.js

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: worklist-1e83a
          channelId: live
