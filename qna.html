<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="그린오피스 고객센터 — 1:1 문의, 자주 묻는 질문(FAQ), 공개 문의 게시판.">
    <title>고객센터 | 그린오피스</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #334155; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        .modal-bg { background: rgba(10,15,30,0.75); backdrop-filter: blur(4px); }
        .tab-btn { padding: 0.9rem 0; color: #64748b; border-bottom: 2px solid transparent; font-weight: 700; width: 50%; text-align: center; font-size: 0.95rem; transition: all 0.2s; background: transparent; cursor: pointer; }
        .tab-btn:hover { color: #16a34a; }
        .tab-btn.active { color: #15803d; border-bottom-color: #16a34a; }
        .form-input, .form-select, .form-textarea { background: #ffffff; border: 1.5px solid #e2e8f0; color: #1e293b; border-radius: 0.6rem; padding: 0.75rem 1rem; width: 100%; font-family: 'Pretendard', sans-serif; font-size: 0.95rem; transition: all 0.2s; }
        .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.1); }
        .form-input::placeholder, .form-textarea::placeholder { color: #94a3b8; }
        .btn { display: inline-flex; align-items: center; justify-content: center; font-weight: 700; padding: 0.75rem 1.5rem; border-radius: 0.6rem; transition: all 0.2s; cursor: pointer; border: 1.5px solid transparent; font-family: 'Pretendard', sans-serif; }
        .btn:disabled { cursor: not-allowed; opacity: 0.5; }
        .btn:hover:not(:disabled) { transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, #16a34a 0%, #059669 100%); color: #fff; box-shadow: 0 4px 14px rgba(22,163,74,0.25); }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 8px 24px rgba(22,163,74,0.35); }
        .btn-secondary { background: #fff; color: #475569; border-color: #cbd5e1; }
        .btn-secondary:hover:not(:disabled) { background: #f8fafc; border-color: #94a3b8; }
        .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.35s ease forwards; }
        .animate-slide-up { animation: slide-up 0.4s ease forwards; }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased">
    <div id="toast-container" class="fixed top-20 right-5 z-[9999] flex flex-col gap-2.5"></div>
    <div id="site-header"></div>

    <main class="pt-16 min-h-screen">
        <section class="bg-white border-b border-slate-100 pt-14 pb-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-50 border border-emerald-100 rounded-2xl flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-headset text-emerald-600 text-xl"></i>
                    </div>
                    <div>
                        <p class="text-xs font-black text-emerald-600 tracking-[0.2em] uppercase mb-1">Customer Center</p>
                        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">고객센터</h1>
                        <p class="text-sm text-slate-500 mt-1">문의 등록, 내 문의 답변 확인, 자주 묻는 질문을 한 번에 확인하세요.</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
            <div class="panel overflow-hidden">
                <div class="flex border-b border-slate-100 bg-white">
                    <button id="tab-inquiry" type="button" class="tab-btn active" onclick="switchTab('inquiry')">1:1 문의</button>
                    <button id="tab-faq" type="button" class="tab-btn" onclick="switchTab('faq')">FAQ</button>
                </div>

                <div id="content-inquiry" class="p-5 sm:p-7 space-y-8">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <section class="rounded-2xl border border-slate-200 bg-slate-50/70 p-5 sm:p-6">
                            <div class="flex items-center justify-between gap-3 mb-5">
                                <div>
                                    <h2 class="text-lg font-black text-slate-900">문의 등록</h2>
                                    <p class="text-xs text-slate-500 mt-1">비공개 문의는 이름과 비밀번호로 답변을 조회합니다.</p>
                                </div>
                                <i class="fas fa-pen-to-square text-emerald-600"></i>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <label for="qnaName" class="block text-xs font-bold text-slate-500 mb-1.5">이름</label>
                                    <input id="qnaName" type="text" class="form-input" placeholder="주문자명 또는 성함">
                                </div>
                                <div>
                                    <div class="block text-xs font-bold text-slate-500 mb-2">공개 여부</div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <label class="flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-bold text-slate-700 cursor-pointer hover:border-emerald-300"><input id="qnaSecret" name="qnaVisibility" type="radio" value="secret" checked class="accent-emerald-600">비공개</label>
                                        <label class="flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-bold text-slate-700 cursor-pointer hover:border-emerald-300"><input id="qnaPublic" name="qnaVisibility" type="radio" value="public" class="accent-emerald-600">공개</label>
                                    </div>
                                </div>
                                <div id="qnaPwWrap"><label for="qnaPw" class="block text-xs font-bold text-slate-500 mb-1.5">비밀번호</label><input id="qnaPw" type="password" class="form-input" placeholder="답변 조회용 비밀번호"></div>
                                <div><label for="qnaTitle" class="block text-xs font-bold text-slate-500 mb-1.5">제목</label><input id="qnaTitle" type="text" class="form-input" placeholder="문의 제목"></div>
                                <div>
                                    <div class="flex items-center justify-between mb-1.5"><label for="qnaBody" class="block text-xs font-bold text-slate-500">내용</label><span class="text-[11px] text-slate-400"><span id="charCount">0</span>자</span></div>
                                    <textarea id="qnaBody" rows="8" class="form-textarea resize-none" placeholder="문의 내용을 입력해주세요."></textarea>
                                </div>
                                <button id="submitBtn" type="button" class="btn btn-primary w-full">문의 등록하기</button>
                            </div>
                        </section>

                        <section class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-6">
                            <div class="flex items-center justify-between gap-3 mb-5"><div><h2 class="text-lg font-black text-slate-900">내 문의 답변 확인</h2><p class="text-xs text-slate-500 mt-1">문의 등록 시 입력한 이름과 비밀번호를 입력하세요.</p></div><i class="fas fa-magnifying-glass text-emerald-600"></i></div>
                            <div class="space-y-3"><div><label for="searchName" class="block text-xs font-bold text-slate-500 mb-1.5">이름</label><input id="searchName" type="text" class="form-input" placeholder="문의 등록 시 입력한 이름"></div><div><label for="searchPw" class="block text-xs font-bold text-slate-500 mb-1.5">비밀번호</label><input id="searchPw" type="password" class="form-input" placeholder="문의 등록 시 입력한 비밀번호"></div><button id="searchBtn" type="button" class="btn btn-secondary w-full">조회하기</button></div>
                            <div id="search-result-area" class="hidden mt-6"><h3 class="text-sm font-black text-slate-800 mb-3">조회 결과</h3><div id="my-qna-list" class="space-y-3"></div></div>
                        </section>
                    </div>

                    <section>
                        <div class="flex items-center justify-between mb-4"><div><h2 class="text-lg font-black text-slate-900">공개 문의</h2><p class="text-xs text-slate-500 mt-1">공개로 등록된 문의와 답변입니다.</p></div></div>
                        <div id="public-qna-list" class="space-y-3"><div class="text-center py-10 text-slate-400 text-sm">공개 문의를 불러오는 중입니다.</div></div>
                    </section>
                </div>

                <div id="content-faq" class="hidden p-5 sm:p-7">
                    <div class="mb-5"><h2 class="text-lg font-black text-slate-900">자주 묻는 질문</h2><p class="text-xs text-slate-500 mt-1">자주 문의하는 내용을 빠르게 확인하세요.</p></div>
                    <div id="faq-list" class="rounded-2xl border border-slate-200 overflow-hidden divide-y divide-slate-100 bg-white"><div class="p-12 text-center text-slate-400 bg-slate-50">FAQ를 불러오는 중입니다.</div></div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="assets/js/maintenance-check.js"></script>
    <script type="module" src="assets/js/pages/qna.js"></script>
</body>
</html>
