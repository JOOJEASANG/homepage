<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>소책자 배치 보기 | 그린오피스</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="assets/css/print-studio.css?v=4"><script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("booklet-embedded");</script><style>
.booklet-embedded .studio-header,.booklet-embedded .studio-heading{display:none}.booklet-embedded .booklet-app.studio-app{min-height:0;padding:12px;max-width:100%;}
.booklet-app.studio-app{max-width:1050px;margin:0 auto;padding:20px;min-height:calc(100dvh - 65px)}.booklet-nav{flex-wrap:wrap}.booklet-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}.booklet-controls{position:sticky;top:16px}.booklet-settings{display:grid;gap:8px}.booklet-settings input,.booklet-settings select{font-size:16px}.booklet-metrics{display:grid;gap:6px;margin:12px 0}.booklet-metric{background:#edf6f0;border-radius:8px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#4f655b;font-size:13px}.booklet-metric strong{font-size:17px;color:#23624f}.booklet-sheets{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.booklet-sheet{border:1px solid #dce7e1;border-radius:10px;background:#fff;padding:14px;min-width:0}.booklet-sheet.cover-sheet{border-color:#9ebeb0}.booklet-sheet h2{font-size:14px;margin:0 0 10px}.booklet-faces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.booklet-face{min-width:0}.booklet-face h3{font-size:12px;margin:0 0 5px;color:#527565}.booklet-spread{display:grid;grid-template-columns:1fr 1fr;background:#dce5e1;border:1px solid #a6b8af;border-radius:4px;overflow:hidden}.booklet-page{aspect-ratio:148/210;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;background:#fff;color:#24483b;font-weight:800;font-size:clamp(15px,2.2vw,28px);min-width:0;padding:4px;overflow-wrap:anywhere}.booklet-page+.booklet-page{border-left:1px dashed #527565}.booklet-page.is-blank{background:repeating-linear-gradient(135deg,#f1f4f2,#f1f4f2 6px,#e5ece8 6px,#e5ece8 12px);color:#667b70;font-size:12px;font-weight:600}.booklet-page.is-cover{background:#e1f0e7}.booklet-page .cover-label{font-size:12px;font-weight:650;color:#3d6655}.booklet-page .cover-label-only{font-size:clamp(12px,1.6vw,18px)}.booklet-app .warning{margin-top:8px}.booklet-note{margin-top:12px;line-height:1.6}.booklet-results-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:16px}.booklet-results-heading span{font-size:12px;font-weight:500;color:#527565}
@media(max-width:640px){.booklet-app.studio-app{padding:10px}.booklet-grid{grid-template-columns:minmax(0,1fr);gap:12px}.booklet-controls{position:static}.booklet-sheet{padding:12px}.booklet-faces{gap:8px}.booklet-page .cover-label{font-size:10px}.booklet-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.booklet-metric{padding:7px 8px;font-size:11px}.booklet-metric strong{font-size:14px}}

<header class="studio-header"><a href="index.html" class="brand">그린오피스 <span>중철 배치 확인</span></a><nav class="booklet-nav"><a href="quote-book.html">책자 견적</a><a href="index.html">홈으로</a></nav></header>
<main class="studio-app booklet-app"><div class="studio-heading"><div><h1>소책자 배치 보기</h1><p>총 페이지 수를 입력하면 중철 제본의 용지별 앞면·뒷면 배치 순서가 표시됩니다.</p></div><div class="actions"><a class="button" href="quote-book.html">책자·제본 견적</a></div></div>
<div class="booklet-grid"><aside class="studio-panel booklet-controls" aria-label="소책자 설정"><h2>배치 설정</h2><div class="booklet-settings"><label><span id="booklet-input-label">총 페이지 수 (표지 포함)</span><input id="booklet-pages" type="number" min="4" max="1000" step="1" value="4" inputmode="numeric"></label><label>표지 구성<select id="booklet-cover"><option value="included">표지 포함 (총 페이지 입력)</option><option value="excluded">표지 미포함 (내지 페이지만 입력)</option></select></label><label>제본 방향<select id="booklet-direction"><option value="left">좌철 · 왼쪽에서 오른쪽</option><option value="right">우철 · 오른쪽에서 왼쪽</option></select></label></div><p id="booklet-cover-note" class="muted"></p><div id="booklet-error" class="warning" role="alert" hidden></div><h2>계산 결과</h2><div class="booklet-metrics" id="booklet-metrics" aria-live="polite"><div class="booklet-metric">전체 배치<strong id="booklet-total"></strong></div><div class="booklet-metric">전체 용지<strong id="booklet-count"></strong></div><div class="booklet-metric">표지 용지<strong id="booklet-cover-count"></strong></div><div class="booklet-metric">내지 용지<strong id="booklet-inner-count"></strong></div><div class="booklet-metric">빈 페이지<strong id="booklet-blanks"></strong></div></div><p class="muted booklet-note">한 장에 4쪽씩 양면 인쇄 후 반접지하는 중철 기준입니다. 실제 출력 파일을 생성하지 않습니다.</p></aside><section aria-label="배치 결과"><h2 class="booklet-results-heading">용지별 배치 결과 <span>바깥쪽 → 안쪽</span></h2><section id="booklet-sheets" class="booklet-sheets" aria-label="용지별 배치"></section><p class="muted booklet-note">점선은 접는 위치입니다. 실제 양면 출력 방향은 장비의 급지·뒤집기 설정에 맞춰 확인하세요.</p></section></div></main><script type="module" src="assets/js/pages/print-studio/booklet.js?v=2"></script></body></html>
